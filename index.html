<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Видеочат</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #0a0a0a; 
            color: #fff; 
            font-family: 'Segoe UI', Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
            flex-direction: column;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            width: 100%;
            background: #141414;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
            font-weight: 400;
            letter-spacing: 1px;
        }
        .video-wrapper {
            position: relative;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        video {
            width: 100%;
            display: block;
            transform: scaleX(-1);
            background: #111;
        }
        .status {
            padding: 10px 16px;
            border-radius: 10px;
            text-align: center;
            font-size: 14px;
            margin: 10px 0;
            font-weight: 500;
        }
        .status.on { background: #1a3a1a; color: #4caf50; }
        .status.off { background: #3a1a1a; color: #f44336; }
        .status.wait { background: #3a3a1a; color: #ffc107; }
        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin: 15px 0;
        }
        .btn {
            background: #2a6df4;
            border: none;
            color: white;
            padding: 12px 28px;
            border-radius: 30px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 500;
            flex: 1 1 auto;
            min-width: 120px;
        }
        .btn:hover { background: #1a5cd4; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn.danger { background: #d32f2f; }
        .btn.danger:hover { background: #b71c1c; }
        .btn.success { background: #2e7d32; }
        .btn.success:hover { background: #1b5e20; }
        .btn.outline { background: transparent; border: 1px solid #555; }
        .btn.outline:hover { background: #222; }
        .link-box {
            background: #1a1a1a;
            padding: 14px 18px;
            border-radius: 12px;
            border: 1px solid #2a2a2a;
            margin: 15px 0;
            word-break: break-all;
            font-size: 14px;
            color: #4caf50;
            display: none;
        }
        .link-box.show { display: block; }
        .link-box .label { color: #888; font-size: 12px; margin-bottom: 6px; }
        .flex-row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .flex-row .btn { flex: 0 1 auto; min-width: auto; padding: 8px 18px; font-size: 13px; }
        #log {
            font-size: 12px;
            color: #555;
            margin-top: 15px;
            max-height: 80px;
            overflow-y: auto;
            border-top: 1px solid #222;
            padding-top: 12px;
            line-height: 1.6;
        }
        #log span { display: block; }
        .timestamp { color: #333; margin-right: 8px; }
        .hidden { display: none; }
        @media (max-width: 500px) {
            .container { padding: 16px; }
            .btn { padding: 10px 16px; font-size: 13px; min-width: 80px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📹 Видеочат</h2>

    <div class="video-wrapper">
        <video id="video" autoplay playsinline></video>
    </div>

    <div id="status" class="status wait">⏳ Нажмите «Включить камеру»</div>

    <div class="controls">
        <button class="btn" id="startBtn">▶ Включить камеру</button>
        <button class="btn success" id="snapBtn" disabled>📸 Снимок</button>
        <button class="btn danger" id="stopBtn" disabled>⏹ Остановить</button>
    </div>

    <div class="link-box" id="linkBox">
        <div class="label">🔗 Ссылка для отправки (скопируйте и отправьте):</div>
        <div class="flex-row">
            <span id="inviteLink" style="flex:1;font-size:13px;color:#4caf50;word-break:break-all;"></span>
            <button class="btn outline" id="copyBtn" style="flex:0 0 auto;">📋 Копировать</button>
        </div>
        <div style="font-size:11px;color:#555;margin-top:6px;">
            ⚠️ Ссылка работает только если вы опубликовали страницу на GitHub Pages или хостинге
        </div>
    </div>

    <div id="log"></div>
</div>

<script>
// ============================================================
// ПРОСТОЙ КОД ДЛЯ РАБОТЫ С КАМЕРОЙ
// ============================================================

const video = document.getElementById('video');
const statusDiv = document.getElementById('status');
const logDiv = document.getElementById('log');
const startBtn = document.getElementById('startBtn');
const snapBtn = document.getElementById('snapBtn');
const stopBtn = document.getElementById('stopBtn');
const linkBox = document.getElementById('linkBox');
const inviteLinkSpan = document.getElementById('inviteLink');
const copyBtn = document.getElementById('copyBtn');

let stream = null;
let isRunning = false;

function log(msg) {
    const time = new Date().toLocaleTimeString();
    const span = document.createElement('span');
    span.innerHTML = `<span class="timestamp">[${time}]</span> ${msg}`;
    logDiv.appendChild(span);
    logDiv.scrollTop = logDiv.scrollHeight;
    if (logDiv.children.length > 50) {
        logDiv.removeChild(logDiv.firstChild);
    }
}

function setStatus(text, type = 'wait') {
    statusDiv.textContent = text;
    statusDiv.className = 'status ' + type;
}

// ==================== КАМЕРА ====================
async function startCamera() {
    try {
        stream = await navigator.mediaDevices.getUserMedia({
            video: {
                width: { ideal: 640 },
                height: { ideal: 480 },
                facingMode: 'user'
            },
            audio: false
        });
        video.srcObject = stream;
        isRunning = true;
        setStatus('🟢 Камера работает', 'on');
        snapBtn.disabled = false;
        stopBtn.disabled = false;
        startBtn.disabled = true;
        log('✅ Камера включена');
        generateLink();
    } catch (err) {
        setStatus('❌ Ошибка: ' + err.message, 'off');
        log('❌ ' + err.message);
        if (err.message.includes('denied')) {
            log('⚠️ Разрешите доступ к камере в браузере');
        }
    }
}

function stopCamera() {
    if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
    }
    video.srcObject = null;
    isRunning = false;
    setStatus('⛔ Камера выключена', 'off');
    snapBtn.disabled = true;
    stopBtn.disabled = true;
    startBtn.disabled = false;
    log('⏹ Камера остановлена');
}

// ==================== СНИМОК ====================
function takeSnapshot() {
    if (!stream || !isRunning) {
        log('⚠️ Сначала включите камеру');
        return;
    }
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0);
    const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
    
    const a = document.createElement('a');
    a.href = dataUrl;
    a.download = 'snapshot_' + Date.now() + '.jpg';
    a.click();
    log('📸 Снимок сохранён');
}

// ==================== ССЫЛКА ====================
function generateLink() {
    const url = window.location.href.split('?')[0];
    const room = 'room_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7);
    const fullLink = url + '?room=' + room;
    inviteLinkSpan.textContent = fullLink;
    linkBox.classList.add('show');
    log('🔗 Ссылка сгенерирована');
}

copyBtn.addEventListener('click', () => {
    const text = inviteLinkSpan.textContent;
    if (!text) return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
            log('📋 Ссылка скопирована');
            copyBtn.textContent = '✅ Готово';
            setTimeout(() => copyBtn.textContent = '📋 Копировать', 2000);
        }).catch(() => {
            fallbackCopy(text);
        });
    } else {
        fallbackCopy(text);
    }
});

function fallbackCopy(text) {
    const textarea = document.createElement('textarea');
    textarea.value = text;
    textarea.style.position = 'fixed';
    textarea.style.left = '-9999px';
    document.body.appendChild(textarea);
    textarea.select();
    try {
        document.execCommand('copy');
        log('📋 Ссылка скопирована');
        copyBtn.textContent = '✅ Готово';
        setTimeout(() => copyBtn.textContent = '📋 Копировать', 2000);
    } catch (e) {
        log('❌ Не удалось скопировать');
    }
    document.body.removeChild(textarea);
}

// ==================== АВТОЗАПУСК ПО ССЫЛКЕ ====================
const params = new URLSearchParams(window.location.search);
if (params.get('room')) {
    log('🔗 Открыто по ссылке (комната: ' + params.get('room') + ')');
    setTimeout(startCamera, 800);
} else {
    log('📄 Страница загружена');
}

// ==================== КНОПКИ ====================
startBtn.addEventListener('click', startCamera);
stopBtn.addEventListener('click', stopCamera);
snapBtn.addEventListener('click', takeSnapshot);
</script>

</body>
</html>
